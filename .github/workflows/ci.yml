name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run release:rc-check
      - uses: actions/upload-artifact@v4
        with:
          name: agoramesh-release-artifacts
          path: release/
          if-no-files-found: error
